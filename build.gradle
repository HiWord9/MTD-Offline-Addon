plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

base {
    archivesName = "$project.archives_base_name-$project.minecraft_version"
}

version = project.mod_version

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
}

dependencies {
    // Basic settings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "io.github.llamalad7:mixinextras-fabric:0.2.2"

    // ModMenu
    implementation "com.terraformersmc:modmenu:21.0.0"

    // YACL
    implementation "dev.isxander:yet-another-config-lib:3.9.7+26.3-fabric"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MyTotemDoll
    implementation "maven.modrinth:ygYU16dG:aMCe9nes"
}

processResources {
    def expandProps = [
            "version"                         : version,
            "group"                           : project.group, //Else we target the task's group.
            "mod_main_dir"                    : mod_main_dir,
            "mod_client_class"                : mod_client_class,

            "fabric_version"                  : fabric_version,
            "loader_version"                  : loader_version,

            "mod_id"                          : mod_id,
            "mod_name"                        : mod_name,
            "mod_description"                 : mod_description,
            "mod_authors"                     : mod_authors.replace(", ", "\", \""),

            "mod_homepage"                    : mod_homepage,

            "mod_sources"                     : mod_sources,
            "mod_issue_tracker"               : mod_issue_tracker,
            "mod_license"                     : mod_license,

            "minecraft_version_range"         : minecraft_version_range,
            "loader_version_range"            : loader_version_range,
            "java_version"                    : java_version
    ]
    filesMatching(['fabric.mod.json', mod_id + '.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

java {
    withSourcesJar()
}

kotlin {
    jvmToolchain(java_version.toInteger())
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}
